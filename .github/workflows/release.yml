name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Semver X.Y.Z to publish (tag vX.Y.Z must exist on the remote)
        required: true

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) — no NPM_TOKEN

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Verify package version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_VERSION#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      # Trusted publisher on npmjs.com (package → Access → Trusted publisher):
      #   Provider: GitHub Actions
      #   Organization: antora-supplemental
      #   Repository: antora-serve
      #   Workflow filename: release.yml
      # Requires npm CLI ≥ 11.5.1 (Node 24). No NPM_TOKEN.
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          NOTES="Release v$VERSION"
          if [ -f CHANGELOG.adoc ]; then
            EXTRACTED=$(awk -v v="$VERSION" '
              $0 ~ "^== \\[" v "\\]" {flag=1; next}
              flag && /^== \[/ {exit}
              flag {print}' CHANGELOG.adoc)
            if [ -n "$EXTRACTED" ]; then NOTES="$EXTRACTED"; fi
          fi
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "$NOTES" || true
