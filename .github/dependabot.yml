version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      antora:
        patterns:
          - "antora"
          - "@antora/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
